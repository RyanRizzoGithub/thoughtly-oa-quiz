<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Operating Alone Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Thoughtly brand, single light theme by design. One column; one question per screen; results replace the quiz. */
:root {
  --teal-light:#E8F5F3; --teal-dark:#0F6E56; --teal-deep:#085041; --teal-border:#9FE1CB;
  --blue:#185FA5; --blue-light:#EBF3FB; --blue-border:#B5D4F4; --blue-dark:#0C447C;
  --coral:#993C1D; --coral-light:#FAF0EB; --coral-border:#F5C4B3; --coral-dark:#712B13;
  --sand:#F5F2ED; --sand-mid:#E8E4DC; --ink:#1A1A18; --ink-mid:#4A4A46; --ink-light:#8A8A84; --white:#FFFFFF;
  --radius:12px; --radius-sm:8px;
  --serif:'DM Serif Display', Georgia, serif; --sans:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--sans); background:var(--sand); color:var(--ink); }

/* Sticky site header with Thoughtly logo + Beta badge */
.site-header { position:sticky; top:0; z-index:200; background:var(--sand); border-bottom:1px solid var(--sand-mid); box-shadow:0 1px 16px rgba(26,25,23,0.06); padding:20px 24px; }
.header-inner { display:flex; justify-content:center; align-items:center; gap:12px; }
.header-logo { display:block; text-decoration:none; line-height:0; }
.header-logo img { height:48px; width:auto; display:block; }
@media (max-width:600px){ .header-logo img { height:36px; } }
.beta-badge { font-family:var(--sans); font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--coral-dark); background:var(--coral-light); border:1px solid var(--coral-border); border-radius:999px; padding:3px 9px; line-height:1; }
.beta-note { font-size:12px; color:var(--ink-light); margin-top:.75rem; font-style:italic; }

.page { max-width:680px; margin:0 auto; padding-block:2rem 4rem; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family:var(--serif); font-size:13px; letter-spacing:.15em; text-transform:uppercase; color:var(--teal-dark); margin-bottom:1rem; }
.header { text-align:center; margin-bottom:2rem; padding-bottom:2rem; border-bottom:1px solid var(--sand-mid); }
.quiz-title { font-family:var(--serif); font-size:clamp(28px,5vw,40px); font-weight:400; line-height:1.2; margin-bottom:.75rem; text-wrap:balance; }
.quiz-sub { font-size:16px; color:var(--ink-mid); line-height:1.65; max-width:480px; margin:0 auto 1rem; }
.quiz-meta { font-size:13px; color:var(--ink-light); letter-spacing:.04em; }
.box { background:var(--white); border-radius:var(--radius); border:1px solid var(--sand-mid); padding:1.5rem; margin-bottom:1.25rem; }
.eyebrow { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark); margin-bottom:10px; }
.box p.txt { font-size:15px; line-height:1.7; }
.rules { list-style:none; margin-top:12px; display:flex; flex-direction:column; gap:6px; }
.rules li { font-size:14px; color:var(--ink-mid); line-height:1.6; padding-left:18px; position:relative; }
.rules li::before { content:""; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:var(--teal-dark); opacity:.5; }
.sub-btn { width:100%; margin-top:1rem; padding:16px; background:var(--teal-dark); color:var(--white); border:none; border-radius:var(--radius); font:500 16px var(--sans); letter-spacing:.02em; cursor:pointer; transition:background .15s; }
.sub-btn:hover { background:var(--teal-deep); }
button:focus-visible, a:focus-visible { outline:3px solid var(--teal-border); outline-offset:3px; }

/* question screen */
.progress { display:flex; gap:5px; margin-bottom:1.5rem; }
.progress span { flex:1; height:4px; border-radius:2px; background:var(--sand-mid); }
.progress span.done { background:var(--teal-dark); }
.progress span.now { background:var(--teal-border); }
.q-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:.4rem; }
.q-theme { font-family:var(--serif); font-size:clamp(30px,6vw,40px); line-height:1.1; }
.q-count { font-size:13px; color:var(--ink-light); font-variant-numeric:tabular-nums; }
.q-ask { font-size:15px; color:var(--ink-mid); margin-bottom:1.25rem; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:540px){ .choices { grid-template-columns:1fr; } }
.choice { font:inherit; text-align:left; color:var(--ink); background:var(--white); border:1.5px solid var(--sand-mid); border-radius:var(--radius); padding:1.25rem; min-height:120px; display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .12s, background .12s; }
.choice:hover { border-color:var(--ink-light); }
.choice.picked { border-color:var(--teal-dark); background:var(--teal-light); }
.choice .tag { width:28px; height:28px; border-radius:var(--radius-sm); background:var(--sand); border:1px solid var(--sand-mid); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-light); }
.choice.picked .tag { background:var(--teal-dark); border-color:var(--teal-dark); color:var(--white); }
.choice .ctext { font-size:15px; line-height:1.6; }
.back { margin-top:1.25rem; background:none; border:none; font:14px var(--sans); color:var(--ink-mid); cursor:pointer; padding:6px 0; }
.back:hover { color:var(--ink); }

/* results */
.res-header { margin-bottom:2rem; }
.res-title { font-family:var(--serif); font-size:clamp(24px,4vw,34px); font-weight:400; line-height:1.25; margin-bottom:.75rem; text-wrap:balance; }
.res-sub { font-size:16px; color:var(--ink-mid); line-height:1.7; }
.map-inner { display:flex; gap:10px; align-items:center; }
.axis-y { font-size:11px; color:var(--ink-light); writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; letter-spacing:.03em; }
.canvas-outer { flex:1; min-width:0; }
.sq { position:relative; width:100%; padding-bottom:100%; }
.sq canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }
.axis-x { font-size:11px; color:var(--ink-light); text-align:center; margin-top:8px; letter-spacing:.03em; }
.pull { display:flex; flex-direction:column; gap:12px; }
.pull-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.pull-strength { font-family:var(--serif); font-size:20px; }
.pull-count { font-size:13px; color:var(--ink-light); font-variant-numeric:tabular-nums; }
.meter { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.meter span { height:10px; border-radius:3px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips span { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid; }
.chips .ss { color:var(--blue-dark); background:var(--blue-light); border-color:var(--blue-border); }
.chips .sf { color:var(--coral-dark); background:var(--coral-light); border-color:var(--coral-border); }
.legend { font-size:12px; color:var(--ink-light); }
.legend b { font-weight:500; }
.zc { border-radius:var(--radius); padding:1.5rem; border:1px solid; margin-bottom:1.25rem; }
.zc-eyebrow { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; }
.zc-headline { font-family:var(--serif); font-size:20px; font-weight:400; line-height:1.4; margin-bottom:14px; }
.zc-body p { font-size:14px; line-height:1.8; margin-bottom:12px; }
.zc-body p:last-child { margin-bottom:0; }
.zc-body ul { margin:8px 0 12px; list-style:none; }
.zc-body li { font-size:14px; line-height:1.7; padding:4px 0 4px 18px; position:relative; }
.zc-body li::before { content:""; position:absolute; left:0; top:13px; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.4; }
.zc-divider { height:1px; background:rgba(0,0,0,.08); margin:16px 0; }
.zc-move-label { font-size:10px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
.zc-move { font-size:14px; line-height:1.65; font-style:italic; }
.zc.ss { background:var(--blue-light); border-color:var(--blue-border); color:var(--blue); }
.zc.ss .zc-headline, .zc.ss .zc-move { color:var(--blue-dark); }
.zc.sf { background:var(--coral-light); border-color:var(--coral-border); color:var(--coral); }
.zc.sf .zc-headline, .zc.sf .zc-move { color:var(--coral-dark); }
.note { font-size:14px; line-height:1.7; color:var(--ink-mid); font-style:italic; }
.o2 { background:var(--white); border-left:3px solid var(--teal-dark); }
.o2 p { font-size:15px; line-height:1.7; color:var(--ink-mid); }
.o2 .reflect { font-family:var(--serif); font-size:22px; line-height:1.3; color:var(--teal-deep); margin-top:12px; }
.bridge { background:var(--teal-light); border-radius:var(--radius); border:2px solid var(--teal-border); padding:1.5rem; margin-bottom:1.25rem; }
.bridge-title { font-family:var(--serif); font-size:20px; color:var(--teal-deep); margin-bottom:8px; }
.bridge-body { font-size:14px; color:var(--teal-dark); line-height:1.7; margin-bottom:1.25rem; }
.bridge-btn { display:inline-block; padding:13px 24px; background:var(--teal-dark); color:var(--white); border-radius:var(--radius-sm); font:500 14px var(--sans); text-decoration:none; }
.bridge-btn:hover { background:var(--teal-deep); }
.retake { display:block; width:100%; padding:13px; background:var(--white); border:1px solid var(--sand-mid); border-radius:var(--radius-sm); font:14px var(--sans); color:var(--ink-mid); cursor:pointer; }
.retake:hover { background:var(--sand); }
@media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>

<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="https://www.bethoughtly.com">
      <img src="https://github.com/RyanRizzoGithub/thoughtly-assets/blob/main/images/graphics/logo.png?raw=true" alt="Thoughtly" style="height:48px;width:auto;display:block;">
    </a>
    <span class="beta-badge">Beta</span>
  </div>
</header>

<div class="page" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ITEMS = [
  {theme:'Wants',      ss:'Right now, I’m more tuned in to what they want than to what I want.', sf:'Right now, I’m more tuned in to what I want than to what they want.'},
  {theme:'Unspoken',   ss:'There’s something I need that I haven’t told them.', sf:'There’s something they want that I haven’t asked them about.'},
  {theme:'Decisions',  ss:'I’m letting their choices decide what happens to me.', sf:'I’m deciding what should happen without asking what they think.'},
  {theme:'Slips',      ss:'When they let me down, I cover for it or let it slide.', sf:'When they let me down, I step in and take over.'},
  {theme:'Self-talk',  ss:'I keep telling myself, “I don’t want to make this harder for them.”', sf:'I keep telling myself, “If I don’t stay on top of this, it will fall apart.”'},
  {theme:'Protection', ss:'Holding back keeps the peace and keeps me from being the bad guy/gal or disappointing others.', sf:'Staying in control keeps things from getting worse.'},
  {theme:'Aftermath',  ss:'Afterward, I’m frustrated with myself for letting it go again.', sf:'Afterward, I’m frustrated that I had to step in again.'}
];

// Dot position by winning count, on the 0-100 chart (x = What I want, y = What others want).
const POS = {7:[15,85], 6:[22,78], 5:[30,70], 4:[40,60]};
const BAND = 8; // O2 band = within 8 points of the diagonal, same as the original chart

const COPY = {
  ss: {
    zone:'Self sacrificing zone',
    title:'In this situation, you are being pulled toward self sacrificing.',
    sub:'Their wants are on the table. Yours mostly are not. You are keeping things moving by carrying more and asking for less.',
    strength:{
      strong:'This pull is running the situation right now. Almost everything on the table belongs to someone else.',
      clear:'This pull shows up in most of how you are handling this, though not all of it.',
      slight:'You are close to the line. Some of what you want is already on the table, and a small move would tip this toward partnership.'
    },
    moveName:'Self-Advocacy', moveDir:'right',
    headline:'You do this because you care. That part is true and it is real and it matters.',
    body:`
      <p>And here is what the research confirms. It works. Self sacrifice reduces conflict immediately. It keeps people connected. It makes you indispensable. Studies show it produces genuine positive outcomes in the short term. People feel supported. Things get done. You show up when others do not. You carry more. You volunteer. You help out. And you tell yourself, correctly, that this is the right thing to do.</p>
      <p>The problem is not the strategy. The problem is the long game.</p>
      <p>Research from the Journal of Occupational and Organizational Psychology shows that self sacrifice produces both positive and negative outcomes simultaneously. What starts as showing up for others gradually becomes tolerating dynamics that others would walk away from. Over time a predictable pattern emerges:</p>
      <ul>
        <li>You accommodate more than you should</li>
        <li>You tolerate dynamics others would walk away from</li>
        <li>Your own needs keep getting moved to the back of the line</li>
        <li>A quiet resentment builds, not because people are ungrateful, but because you stopped asking for what you need</li>
      </ul>
      <p>And the research is clear on where this ends. High levels of altruistic motivation combined with a diminished ability to say no is one of the strongest predictors of burnout.</p>
      <p>You end up doing it alone. Not because you failed. Because the strategy worked exactly as it was designed to.</p>`,
    move:'Next time someone makes a request, ask for time to think about it before saying yes. Allow yourself the space to think about what you want, what you have the capacity for, and how both your wants and their wants can be met.'
  },
  sf: {
    zone:'Self focusing zone',
    title:'In this situation, you are being pulled toward self focusing.',
    sub:'Your wants are on the table. Theirs mostly are not. You are keeping things moving by deciding, fixing, and holding the standard yourself.',
    strength:{
      strong:'This pull is running the situation right now. Almost everything on the table is yours.',
      clear:'This pull shows up in most of how you are handling this, though not all of it.',
      slight:'You are close to the line. Some of what they want is already on the table, and a small move would tip this toward partnership.'
    },
    moveName:'Consideration', moveDir:'up',
    headline:'You know what good looks like. You always have. And that is a genuine asset.',
    body:`
      <p>And here is what the research confirms. It works. High standards drive results. In high stakes situations, taking control, making the call, and driving toward the outcome is exactly the right strategy. Research confirms that leaders with high standards and strong conviction are more likely to be diligent, more ethical, and more engaged in their work. These are real strengths.</p>
      <p>The problem is not the standard. The problem is the long game.</p>
      <p>Research shows that over time self focusing creates a predictable pattern:</p>
      <ul>
        <li>Others stop bringing their best because they know it will be reworked</li>
        <li>Initiative drops because the window to act keeps closing before they get the chance</li>
        <li>The leader becomes the bottleneck, doing more as the team does less</li>
        <li>Self focusing is consistently cited as one of the top three reasons employees resign</li>
      </ul>
      <p>Research on perfectionism in leadership adds one more finding worth sitting with. When leaders impose their standards on others rather than creating conditions for others to rise to them, it reduces psychological safety, stifles creativity, and ultimately leads to the leader's own burnout.</p>
      <p>You end up doing it alone. Not because your standards are wrong. Because the strategy of doing it yourself does not scale.</p>`,
    move:'The next time you feel the urge to step in, ask one question instead. What do you think? Then allow the other person some space to connect their own dots.'
  }
};

const app = document.getElementById('app');
let state = fresh();
let chart = null;
function fresh(){ return { step:'intro', i:0, answers:Array(7).fill(null), order:ITEMS.map(()=>Math.random()<.5), bothWays:null }; }
const go = s => { state.step = s; render(); window.scrollTo(0,0); };

function render(){
  if (chart) { chart.destroy(); chart = null; }
  ({intro, q:question, check, result})[state.step]();
}

function intro(){
  app.innerHTML = `
    <div class="header">
      <h1 class="quiz-title">The Operating Alone Score</h1>
      <p class="quiz-sub">Which way are you being pulled? Seven quick choices show whose wants are on the table, and the one move that brings you toward partnership.</p>
      <p class="quiz-meta">7 questions &nbsp;·&nbsp; about 1 minute &nbsp;·&nbsp; instant results</p>
      <p class="beta-note">This is a beta version we're testing. Your feedback helps us make it better.</p>
    </div>
    <div class="box">
      <p class="eyebrow">Before you begin</p>
      <p class="txt">Bring to mind one situation that is not going the way you want it to. A relationship. A team. A project. A conversation you keep avoiding. A person who keeps letting you down. Hold that situation in mind for every question.</p>
      <ul class="rules">
        <li>Each question shows two statements. Choose the one that is more true.</li>
        <li>If both feel true, pick the one that is true more often.</li>
        <li>If neither fits perfectly, pick the closer one.</li>
      </ul>
    </div>
    <button class="sub-btn" id="start">I have my situation. Start.</button>`;
  document.getElementById('start').onclick = () => { state.i = 0; go('q'); };
}

function question(){
  const i = state.i, it = ITEMS[i];
  const first = state.order[i] ? 'ss' : 'sf', second = first === 'ss' ? 'sf' : 'ss';
  const picked = state.answers[i];
  const card = (side, letter) => `<button class="choice ${picked===side?'picked':''}" data-side="${side}" id="choice-${letter}">
      <span class="tag">${letter}</span><span class="ctext">${it[side]}</span></button>`;
  app.innerHTML = `
    <div class="progress" aria-hidden="true">${ITEMS.map((_,k)=>`<span class="${k<i?'done':k===i?'now':''}"></span>`).join('')}</div>
    <div class="q-head"><div class="q-theme">${it.theme}</div><div class="q-count">${i+1} of 7</div></div>
    <p class="q-ask">Thinking about your situation, which is more true right now?</p>
    <div class="choices">${card(first,'A')}${card(second,'B')}</div>
    <button class="back" id="back">← Back</button>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    state.answers[i] = b.dataset.side;
    b.classList.add('picked');
    setTimeout(() => {
      if (i < 6) { state.i++; go('q'); }
      else go(tally().win === 4 ? 'check' : 'result');
    }, 200);
  });
  document.getElementById('back').onclick = () => { if (i === 0) go('intro'); else { state.i--; go('q'); } };
}

function check(){
  app.innerHTML = `
    <div class="progress" aria-hidden="true">${ITEMS.map(()=>'<span class="done"></span>').join('')}</div>
    <div class="q-head"><div class="q-theme">One more</div></div>
    <p class="q-ask">Your answers were close. Which is closer to true in this situation?</p>
    <div class="choices">
      <button class="choice" id="both-a"><span class="tag">A</span><span class="ctext">Both of us have said what we want, and we’re working it out together.</span></button>
      <button class="choice" id="both-b"><span class="tag">B</span><span class="ctext">Neither of us has really said what we want. I’m just getting through it.</span></button>
    </div>
    <button class="back" id="back">← Back</button>`;
  document.getElementById('both-a').onclick = () => { state.bothWays = false; go('result'); };
  document.getElementById('both-b').onclick = () => { state.bothWays = true; go('result'); };
  document.getElementById('back').onclick = () => { state.i = 6; go('q'); };
}

function tally(){
  const ss = state.answers.filter(a => a === 'ss').length, sf = 7 - ss;
  return { ss, sf, side: ss > sf ? 'ss' : 'sf', win: Math.max(ss, sf) };
}

function result(){
  const t = tally(), c = COPY[t.side];
  const level = t.win >= 6 ? 'strong' : t.win === 5 ? 'clear' : 'slight';
  const label = { strong:'Strong pull', clear:'Clear pull', slight:'Slight pull' }[level];
  const [x, y] = t.side === 'ss' ? POS[t.win] : [POS[t.win][1], POS[t.win][0]];
  const meter = Array.from({length:7}, (_,k) => {
    const isWin = k < t.win;
    const col = (isWin ? t.side : (t.side==='ss'?'sf':'ss')) === 'ss' ? 'var(--blue)' : 'var(--coral)';
    return `<span style="background:${col};opacity:${isWin?1:.35}"></span>`;
  }).join('');
  const chips = ITEMS.map((it,k) => `<span class="${state.answers[k]}">${it.theme}</span>`).join('');

  app.innerHTML = `
    <div class="res-header">
      <h2 class="res-title">${c.title}</h2>
      <p class="res-sub">${c.sub} ${c.strength[level]}</p>
    </div>

    <div class="box">
      <p class="eyebrow" style="color:var(--ink-light)">Your dot on the model</p>
      <div class="map-inner">
        <div class="axis-y">What others want</div>
        <div class="canvas-outer">
          <div class="sq"><canvas id="mapChart" role="img" aria-label="Thoughtly model. Your dot is in the ${c.zone}, with an arrow pointing ${c.moveDir} toward the O2 zone, labeled ${c.moveName}."></canvas></div>
          <p class="axis-x">What I want</p>
        </div>
      </div>
    </div>

    <div class="box pull">
      <div class="pull-top">
        <span class="pull-strength">${label}</span>
        <span class="pull-count">${t.win} of 7 choices toward ${t.side==='ss'?'self sacrificing':'self focusing'}</span>
      </div>
      <div class="meter" aria-hidden="true">${meter}</div>
      <div class="chips">${chips}</div>
      <p class="legend"><b style="color:var(--blue)">Blue</b> = self sacrificing choice &nbsp;·&nbsp; <b style="color:var(--coral)">Coral</b> = self focusing choice</p>
      ${state.bothWays ? `<p class="note">Your pull is slight, but that may be because not much of anyone’s wants are on the table. The first move is the same: put one want on the table, yours or theirs.</p>` : ''}
    </div>

    <div class="zc ${t.side}">
      <p class="zc-eyebrow">${c.zone}</p>
      <p class="zc-headline">${c.headline}</p>
      <div class="zc-body">${c.body}</div>
    </div>

    <div class="box o2">
      <p class="eyebrow">Where the arrow points</p>
      <p>The goal is not to swing to the other side. It is to get both sets of wants on the table. That is the O₂ zone: All In Partnership.</p>
    </div>

    <div class="bridge">
      <p class="bridge-title">This is your dot. Want to know what is driving it?</p>
      <p class="bridge-body">The full ACE Assessment goes 138 questions deep. It maps exactly where you overfunction, where you underadvocate, and the specific traits keeping you out of the O₂ zone. You get a full breakdown on a 1:1 Zoom call.</p>
      <a href="https://ace.bethoughtly.com/" target="_blank" rel="noopener" class="bridge-btn">Take the full ACE Assessment ↗</a>
    </div>
    <button class="retake" id="retake">Retake the quiz</button>`;

  document.getElementById('retake').onclick = () => { state = fresh(); go('intro'); };
  setTimeout(() => drawMap(x, y, t.side), 60);
}

function drawMap(xPct, yPct, side){
  const B = BAND;
  const dotColor = side === 'ss' ? '#185FA5' : '#993C1D';
  const arrowColor = '#0F6E56';
  const lc = 'rgba(0,0,0,0.38)';
  // Arrow runs from the dot to the edge of the O2 band: right for self sacrificing, up for self focusing.
  const end = side === 'ss' ? [yPct - B, yPct] : [xPct, xPct - B];

  const zones = {
    id:'zones',
    beforeDatasetsDraw(ch){
      const { ctx, chartArea:{ left, top, right, bottom, width, height } } = ch;
      const tx = v => left + (v/100)*width, ty = v => bottom - (v/100)*height;
      ctx.save();
      // Self sacrificing (top-left), self focusing (bottom-right), O2 band (diagonal)
      ctx.beginPath(); ctx.moveTo(left, ty(B)); ctx.lineTo(tx(100-B), top); ctx.lineTo(left, top); ctx.closePath();
      ctx.fillStyle = 'rgba(24,95,165,0.10)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx(B), bottom); ctx.lineTo(right, ty(100-B)); ctx.lineTo(right, bottom); ctx.closePath();
      ctx.fillStyle = 'rgba(153,60,29,0.10)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(left, ty(B)); ctx.lineTo(tx(100-B), top); ctx.lineTo(right, top); ctx.lineTo(right, ty(100-B)); ctx.lineTo(tx(B), bottom); ctx.lineTo(left, bottom); ctx.closePath();
      ctx.fillStyle = 'rgba(74,175,160,0.20)'; ctx.fill();

      ctx.font = '500 11px "DM Sans", sans-serif';
      ctx.fillStyle = '#185FA5'; ctx.textAlign = 'left'; ctx.fillText('Self sacrificing', left + 8, top + 16);
      ctx.fillStyle = '#993C1D'; ctx.textAlign = 'right'; ctx.fillText('Self focusing', right - 8, bottom - 8);
      ctx.save(); ctx.translate(tx(66), ty(66)); ctx.rotate(-Math.PI/4);
      ctx.fillStyle = '#0F6E56'; ctx.textAlign = 'center'; ctx.fillText('O₂ zone · All-In Partnership', 0, 4);
      ctx.restore();

      // Move arrow
      const x0 = tx(xPct), y0 = ty(yPct), x1 = tx(end[0]), y1 = ty(end[1]);
      ctx.strokeStyle = arrowColor; ctx.fillStyle = arrowColor; ctx.lineWidth = 2.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
      const ang = Math.atan2(y1 - y0, x1 - x0), h = 10;
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - h*Math.cos(ang - 0.45), y1 - h*Math.sin(ang - 0.45));
      ctx.lineTo(x1 - h*Math.cos(ang + 0.45), y1 - h*Math.sin(ang + 0.45));
      ctx.closePath(); ctx.fill();
      ctx.font = '600 12px "DM Sans", sans-serif';
      if (side === 'ss') { ctx.textAlign = 'center'; ctx.fillText(COPY.ss.moveName + ' →', (x0 + x1)/2 + 6, y0 - 14); }
      else { ctx.save(); ctx.translate(x0 - 14, (y0 + y1)/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText(COPY.sf.moveName + ' →', 0, 0); ctx.restore(); }
      ctx.restore();
    }
  };

  chart = new Chart(document.getElementById('mapChart'), {
    type:'scatter', plugins:[zones],
    data:{ datasets:[{ data:[{x:xPct, y:yPct}], backgroundColor:dotColor, borderColor:'#fff', borderWidth:2.5, pointRadius:12, pointHoverRadius:12 }] },
    options:{
      responsive:true, maintainAspectRatio:true, aspectRatio:1,
      animation:{ duration:900, easing:'easeOutQuart' },
      scales:{
        x:{ min:0, max:100, grid:{ color:'rgba(0,0,0,0.05)' }, ticks:{ display:false }, border:{ display:false } },
        y:{ min:0, max:100, grid:{ color:'rgba(0,0,0,0.05)' }, ticks:{ display:false }, border:{ display:false } }
      },
      plugins:{ legend:{ display:false }, tooltip:{ enabled:false } }
    }
  });
}

render();
</script>
